name: Release

# Quando arriva un tag vX.Y.Z crea la release su GitHub con la sezione corrispondente del CHANGELOG.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Il CHANGELOG si legge sempre da main: i tag delle versioni vecchie possono essere precedenti al file.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Note dal CHANGELOG
        run: |
          versione="${GITHUB_REF_NAME#v}"
          awk -v v="$versione" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro && /^\[.*\]: / { exit }
            dentro { print }
          ' CHANGELOG.md > note.md
          if [ ! -s note.md ]; then echo "Nessuna sezione $versione nel CHANGELOG" >&2; exit 1; fi
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file note.md --verify-tag
