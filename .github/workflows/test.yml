name: Test

on:
  push:
    branches: [main]
    paths-ignore: ['data/notizie/**', 'data/state.json', 'data/ics-state.json', 'data/variations.json']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
